apiVersion: v1
kind: Pod
metadata:
  name: ria
  labels:
        app: ria
spec:
  containers:
  - name: ria
    image: honeybee.azurecr.io/repo1:jaba
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ria
  namespace: default
  labels:
    app: ria
 
spec:
  externalTrafficPolicy: Local
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: ria
  type: LoadBalancer
