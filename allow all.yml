# nginx-pods.yaml
apiVersion: v1
kind: Pod
metadata:
  name: nginx-6
  namespace: default
  labels:
    app: nginx-6
spec:
  containers:
  - name: nginx-6
    image: nginx-6
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-6
  namespace: default
labels:
    app: nginx-6
 
spec:
  externalTrafficPolicy: Local
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: nginx-6
  type: LoadBalancer


