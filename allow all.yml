# nginx-pods.yaml
apiVersion: v1
kind: Pod
metadata:
  name: nginx-6
  namespace: default
  labels:
    app: nginx-6
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-6
  namespace: default
spec:
  selector:
    app: nginx-6
  ports:
  - port: 80
    targetPort: 80
selector:
    app: nginx-6
  type: LoadBalancer


