apiVersion: apps/v1
kind: Deployment
metadata:
name: nginx-green
namespace: blue-green-demo
spec:
replicas: 3
selector:
matchLabels:
app: nginx
version: green
template:
metadata:
labels:
app: nginx
version: green
spec:
containers:
- name: nginx
image: nginx:1.21
ports:
- containerPort: 80
volumeMounts:
- name: html
mountPath: /usr/share/nginx/html
volumes:
- name: html
configMap:
name: nginx-green-config
---
apiVersion: v1
kind: ConfigMap
metadata:
name: nginx-green-config
namespace: blue-green-demo
data:
index.html: |
<!DOCTYPE html>
<html>
<head>
<title>Green Version - New Release</title>
<style>
body {
background-color: #2ecc71;
color: white;
text-align: center;
padding-top: 20%;
font-family: Arial;
}
</style>
</head>
<body>
<h1>🟢 GREEN VERSION (v2.0)</h1>
<p>New Release Candidate</p>
<p>Ready to switch traffic!</p>
</body>
</html>