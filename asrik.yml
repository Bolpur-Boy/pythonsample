apiVersion: v1
kind: Pod
metadata:
  name: alo
  labels:
        app: alo
spec:
  containers:
  - name: alo
    image: honeybee.azurecr.io/repo2:padma
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: alo
  namespace: default
  labels:
    app: alo
 
spec:
  externalTrafficPolicy: Local
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: alo
  type: LoadBalancer
