apiVersion: v1
kind: Pod
metadata:
  name: ria
  labels:
        app: ria
spec:
  containers:
  - name: ria
    image: ria:latest
    ports:
    - containerPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: ria
  namespace: default
  labels:
    app: ria
 
spec:
  externalTrafficPolicy: Local
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
  selector:
    app: ria
  type: LoadBalancer
