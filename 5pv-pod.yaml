apiVersion: v1
kind: Pod
metadata:
  name: log-writer
spec:
  containers:
    - name: log-writer-container
      image: busybox
      command:
        - "sh"
        - "-c"
        - "while true; do echo $(date) >> /var/log/app/app.log; sleep 10; done"
      volumes:
    - name: logs-pv-storage
      persistentVolumeClaim:
        claimName: logs-pv-claim
  volumeMounts:
        - mountPath: "/var/log/app"
          name: logs-pv-storage

